# 010 sec01 検証用: red-gate/setup-flyway@v3 で Flyway CLI をランナーへ導入し、
# services: で起動した PostgreSQL に対して validate → migrate を実行する基本ワークフロー。
name: Flyway setup-flyway@v3 Demo

on:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          edition: community
          i-agree-to-the-eula: true
          version: '12.11.0'

      - name: Flyway version
        run: flyway --version

      - name: Validate and Migrate
        run: |
          flyway validate -ignoreMigrationPatterns='*:pending'
          flyway migrate
        env:
          FLYWAY_URL: jdbc:postgresql://localhost:5432/appdb
          FLYWAY_USER: postgres
          FLYWAY_PASSWORD: postgres
          FLYWAY_LOCATIONS: filesystem:db/010-actions-migration
          FLYWAY_CONNECT_RETRIES: 20
