name: CI Flyway Migrate
on: push
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 'Install Flyway CLI'
        run: |
          curl -sSL https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/12.8.1/flyway-commandline-12.8.1-linux-x64.tar.gz -o flyway.tar.gz
          tar xzf flyway.tar.gz
          echo "$PWD/flyway-12.8.1" >> "$GITHUB_PATH"
      - name: 'Flyway Info / Validate(pending許容) / Migrate'
        run: |
          flyway info
          flyway validate -ignoreMigrationPatterns='*:pending'
          flyway migrate
        env:
          FLYWAY_URL: jdbc:postgresql://pg-ci:5432/appdb
          FLYWAY_USER: postgres
          FLYWAY_PASSWORD: postgres
          FLYWAY_LOCATIONS: filesystem:src/main/resources/db/migration
          FLYWAY_CONNECT_RETRIES: 20
