# 記事 007 の 2.3 節: info → validate（未適用は除外）→ migrate を、
# services: で起動した PostgreSQL に対して実行する。
name: CI Flyway Migrate

on: push

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: red-gate/setup-flyway@v3
        with:
          edition: community
          i-agree-to-the-eula: true
          version: '12.11.0'
      - name: 'Flyway Info / Validate(pending許容) / Migrate'
        run: |
          flyway info
          flyway validate -ignoreMigrationPatterns='*:pending'
          flyway migrate
        env:
          FLYWAY_URL: jdbc:postgresql://localhost:5432/appdb
          FLYWAY_USER: postgres
          FLYWAY_PASSWORD: postgres
          FLYWAY_LOCATIONS: filesystem:db/ci-migration
          FLYWAY_CONNECT_RETRIES: 20
