apiVersion: v1
kind: ConfigMap
metadata:
  name: my-app-migrations-cm
data:
  V1__create_orders.sql: |
    CREATE TABLE orders (
        id      BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        product VARCHAR(255) NOT NULL
    );
  V2__add_amount.sql: |
    ALTER TABLE orders ADD COLUMN amount INTEGER NOT NULL DEFAULT 0;
