apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
spec:
  replicas: 3
  selector:
    matchLabels: { app: my-app }
  template:
    metadata:
      labels: { app: my-app }
    spec:
      initContainers:
      - name: flyway-migration
        image: flyway/flyway:12-alpine
        args: ["migrate"]
        env:
        - { name: FLYWAY_URL,      valueFrom: { secretKeyRef: { name: db-credentials, key: url } } }
        - { name: FLYWAY_USER,     valueFrom: { secretKeyRef: { name: db-credentials, key: user } } }
        - { name: FLYWAY_PASSWORD, valueFrom: { secretKeyRef: { name: db-credentials, key: password } } }
        - { name: FLYWAY_LOCATIONS, value: "filesystem:/flyway/sql" }
        - { name: FLYWAY_CONNECT_RETRIES, value: "20" }
        volumeMounts:
        - { name: migration-sql-volume, mountPath: /flyway/sql }
      containers:
      - name: my-app-container
        image: nginx:1.27-alpine
        ports: [{ containerPort: 80 }]
      volumes:
      - name: migration-sql-volume
        configMap: { name: my-app-migrations-cm }
